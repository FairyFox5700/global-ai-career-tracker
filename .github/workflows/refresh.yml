name: Daily official-source refresh

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Refresh official listings
        run: python scripts/refresh.py
      - name: Verify generated data
        run: python -m unittest discover -s tests -v
      - name: Commit changed generated data
        run: |
          if git diff --quiet -- data/jobs.json data/refresh-report.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/refresh-report.json
          git commit -m "chore: refresh official career data"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy refreshed tracker to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
